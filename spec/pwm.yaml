- id: ADV-PWM-001
  statement: Each actuator output of the pwm-actuator map is taken from the timer channel at the same index in pwms.
  source:
    devicetree: Devicetree Specification v0.4; Zephyr pwms binding
    manual: RM0410 Rev 5 section 26.3.9; RM0433 Rev 8 section 39.3.9 (PWM mode)
  scope: Motor N of the airframe receives the firmware's output N.
  verification: generated
  applies_to: pwm-map
  tests:
  - id: ADV-PWM-001.T1
    stimulus: Build the board and list the actuator map.
    expect: Index i maps to the timer and channel of pwms entry i decoded independently from the DTB.
- id: ADV-PWM-002
  statement: In edge-aligned PWM mode 1 a channel's high time is CCR x (PSC+1) / timer clock and its period (ARR+1) x (PSC+1)
    / timer clock, with the timer clock of the board's MCU.
  source:
    devicetree: none
    manual: RM0410 Rev 5 section 26.3.9 and section 5.2 (timer clocks); RM0433 Rev 8 sections 39.3.9 and 8.5 (timer clocks)
  scope: A 1.5 ms command is read as 1.5 ms on both F7 and H7.
  verification: unit
  applies_to: pwm-timer
  tests:
  - id: ADV-PWM-002.T1
    stimulus: Program PSC, ARR and CCR for 1000, 1500 and 2000 us on F765 and H743 clock settings.
    expect: Measured pulse widths equal the programmed ones.
- id: ADV-PWM-003
  statement: A PWM provider reports every period of a watched channel to its listener, in period order, with the period's
    high time and length and the clock at which it started (the update event that loads the period's shadow values), also
    when it catches up late; consecutive identical periods may come as one run with their count. UG starts a period unless
    UDIS is set.
  source:
    devicetree: none
    manual: RM0410 Rev 5 sections 25.3.1 (time-base unit, update event, preload) and 26.3.9 (PWM mode); 25.4.1 (UDIS, UG)
  scope: An ESC model receives every DShot bit, none lost or merged, whatever the tick pattern.
  verification: unit
  applies_to: pwm-timer
  tests:
  - id: ADV-PWM-003.T1
    stimulus: PX4's DShot600 frame on TIM1 (DMA bursts), listeners on CH1-4, ticked at every update and once at the end.
    expect: Idle, the 16 bits (7 or 14 counts high), the end word, idle, each at its update clock; the same both ways.
  - id: ADV-PWM-003.T2
    stimulus: A steady channel without DMA over 1000 updates in one tick.
    expect: At most three calls whose periods add up to 1000, each period's start on the update clocks.
  - id: ADV-PWM-003.T3
    stimulus: UG with the counter stopped, then under UDIS; the listener removed; channels 0 and 5.
    expect: One period at UG's clock, none under UDIS, none after removal; the channels refused.
