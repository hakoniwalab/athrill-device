- id: ADV-DMA-001
  statement: A transfer moves the programmed number of items between the requested source and destination, in order.
  source:
    devicetree: none
    manual: RM0410 sections 8.3.4-8.3.10; RM0433 sections 15.3.5-15.3.11
  scope: Drivers' buffers contain exactly the transferred data.
  verification: unit
  applies_to: dma-protocol
  tests:
  - id: ADV-DMA-001.T1
    stimulus: Request N items peripheral-to-memory and memory-to-peripheral.
    expect: Exactly N items arrive in order; remaining count reaches 0.
- id: ADV-DMA-002
  statement: Half-transfer and transfer-complete events are reported at the item that reaches half and the last item, at the
    modelled clock.
  source:
    devicetree: none
    manual: RM0410 section 8.3.14; RM0433 section 15.3.15
  scope: RTOS drivers wake on HT/TC at the right time.
  verification: unit
  applies_to: dma-protocol
  tests:
  - id: ADV-DMA-002.T1
    stimulus: Run an N-item transfer with HT and TC enabled.
    expect: HT after item N/2, TC after item N, each at the clock of that item.
- id: ADV-DMA-003
  statement: In circular mode the count reloads after completion and transfers continue at the start of the buffer.
  source:
    devicetree: none
    manual: RM0410 section 8.3.9; RM0433 section 15.3.10
  scope: Continuous UART/ADC reception keeps running.
  verification: unit
  applies_to: dma-protocol
  tests:
  - id: ADV-DMA-003.T1
    stimulus: Run two rounds of a circular N-item transfer.
    expect: After TC the count is N again and the next item goes to the buffer start.
- id: ADV-DMA-004
  statement: Data width conversion between source and destination follows the manual's packing and unpacking rules.
  source:
    devicetree: none
    manual: RM0410 section 8.3.11; RM0433 section 15.3.12
  scope: Byte peripherals feed word buffers correctly.
  verification: unit
  applies_to: dma-protocol
  tests:
  - id: ADV-DMA-004.T1
    stimulus: Transfer bytes to words and words to bytes.
    expect: Packing and order as in the manual's width table.
- id: ADV-DMA-005
  statement: A DMA controller node is instantiated with the request lines its consumers' dmas reference.
  source:
    devicetree: Zephyr DMA binding (dmas, dma-names) and st,stm32-dma-v1 / st,stm32-dmamux bindings
    manual: RM0433 section 17.3 (DMAMUX request lines); RM0410 table 27
  scope: Peripherals reach the DMA stream the board wires.
  verification: generated
  applies_to: dma-controller
  tests:
  - id: ADV-DMA-005.T1
    stimulus: Build the board; list DMA resolutions whose provider is this controller.
    expect: Each matches a consumer dmas tuple decoded independently from the DTB.
