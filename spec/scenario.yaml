- id: ADV-SCENARIO-001
  statement: A scenario file is text in which '#' starts a comment to the end of the line and blank lines are skipped;
    the first other line is the header time_ms,<name>,... with unique names, and every following line is a row of
    numbers, one per header column, whose time_ms (milliseconds of the target clock, fractions allowed) strictly
    increases. A header without time_ms first, a duplicate name, a row with another number of fields or a field that
    is not a number, a time that does not increase, a file without rows, and a file that cannot be read are refused
    with a message that names the file and, for a format error, the line.
  source:
    devicetree: athrill,scenario-file of a model that reads a scenario (athrill,crsf-receiver)
    manual: none (the simulator's own input format; docs/configuration.md, Scenario files)
  scope: A run replays recorded or written inputs (pilot sticks, later faults or other events) on the target clock,
    in lockstep with the physics, instead of sending them from the host's clock.
  verification: unit
  applies_to: scenario
  tests:
  - id: ADV-SCENARIO-001.T1
    stimulus: A file with comment lines, a blank line, a header with spaces and a trailing comment, and three rows.
    expect: Three channels and three rows; names resolve to their columns, an unknown name to none; the first row is at
      10 ms.
  - id: ADV-SCENARIO-001.T2
    stimulus: Files with an equal time on line 5, a short row, a word in a number field, a header without time_ms, a
      duplicate name, no rows, and a missing file.
    expect: Each is refused; the messages name the file and the lines 5, 3, 2 and 1.
- id: ADV-SCENARIO-002
  statement: A scenario channel has no value before the first row; from a row's time until the next row's time it has
    that row's value (zero-order hold), and after the last row the last value holds. The offset in milliseconds is
    added to every row time. A reader whose lookup time goes back searches again from the first row.
  source:
    devicetree: athrill,scenario-offset-ms; the host value of the reading model (DEVICE_CONFIG_RC_SCENARIO_OFFSET_MS)
    manual: none (docs/configuration.md, Scenario files)
  scope: Recorded inputs are applied as sampled, without inventing values between samples.
  verification: unit
  applies_to: scenario
  tests:
  - id: ADV-SCENARIO-002.T1
    stimulus: Rows at 10, 20 and 30 ms read just before 10 ms, at 10 ms, just before 20 ms, at 20 ms, at 25 ms, at 30 ms,
      long after, back at 15 ms, and for a channel that does not exist.
    expect: No value; 1; 100; 2; 2; 300; 3; 1; no value.
  - id: ADV-SCENARIO-002.T2
    stimulus: The same file with an offset of 2500 ms.
    expect: The first row is at 2510 ms; no value at 10 ms; the second row's value at 2520 ms.
