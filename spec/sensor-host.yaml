- id: ADV-SENSOR-HOST-001
  statement: When HAKO_SENSOR_DEVICE_SENSORS configures sensor instances, at least one enabled sensor chip must name a hakoniwa,sensor-instance with value-source; otherwise board construction stops with an error naming HAKO_SENSOR_DEVICE_SENSORS and value-source.
  source:
    devicetree: hakoniwa,sensor-instance and sensor-chip value-source
    manual: docs/sensor-host.md, Wiring consistency
  scope: A configured sensor host cannot silently leave every chip on the aircraft's common sensor value.
  verification: unit
  applies_to: sensor-host
  tests:
  - id: ADV-SENSOR-HOST-001.T1
    stimulus: Build a board with HAKO_SENSOR_DEVICE_SENSORS set and every sensor chip wired to hakoniwa,sensor-device.
    expect: Construction fails before the firmware starts and the error names HAKO_SENSOR_DEVICE_SENSORS and value-source.
- id: ADV-SENSOR-HOST-002
  statement: When a board has an enabled hakoniwa,sensor-instance, no enabled sensor chip may name hakoniwa,sensor-device with value-source; otherwise board construction stops with an error naming the chip and both compatibles.
  source:
    devicetree: hakoniwa,sensor-instance, hakoniwa,sensor-device and sensor-chip value-source
    manual: docs/sensor-host.md, Wiring consistency
  scope: A partly rewired board cannot mix per-chip instances with the aircraft's common sensor value.
  verification: unit
  applies_to: sensor-host
  tests:
  - id: ADV-SENSOR-HOST-002.T1
    stimulus: Build a board with a hakoniwa,sensor-instance and a sensor chip whose value-source is hakoniwa,sensor-device.
    expect: Construction fails and the error names the chip path, hakoniwa,sensor-device and hakoniwa,sensor-instance.
- id: ADV-SENSOR-HOST-003
  statement: In FIFO operation an IMU chip reports each part's programmed sample period initially and after a rate change; before the next physics step the sensor host either makes the adapter follow or emits an ERROR naming the instance, part, chip period and adapter period.
  source:
    devicetree: sensor-chip value-source to hakoniwa,sensor-instance
    manual: docs/sensor-host.md, Chip rates; AthrillDeviceSamplePeriodOps ABI 1.22
  scope: A slower adapter cannot silently alias motion sampled by a faster chip.
  verification: unit
  applies_to: sensor-host
  tests:
  - id: ADV-SENSOR-HOST-003.T1
    stimulus: Start each supported IMU FIFO and change its programmed output data rate.
    expect: The value source receives the initial period for every FIFO part and receives the changed period.
  - id: ADV-SENSOR-HOST-003.T2
    stimulus: Compare a 4 ms adapter with a 0.5 ms chip at a 0.125 ms physics step, using an adapter that supports only a shared IMU period.
    expect: The shared adapter is changed to 0.5 ms and the INFO names the instance, part and both periods; if both setters refuse, an ERROR names the same values and the adapter reason.
- id: ADV-SENSOR-HOST-004
  statement: An enabled hakoniwa,sensor-instance without a configured plugin mapping stops board construction with an error that names the DEVICE_CONFIG_DEVICE_PLUGIN_1 hakoniwa%2Csensor-instance line to add.
  source:
    devicetree: hakoniwa,sensor-instance compatible
    manual: docs/sensor-host.md, Wiring the chips to their instances
  scope: A missing instance plugin mapping is directly actionable.
  verification: unit
  applies_to: sensor-host
  tests:
  - id: ADV-SENSOR-HOST-004.T1
    stimulus: Build a board containing hakoniwa,sensor-instance with only the hakoniwa,sensor-device plugin mapping.
    expect: Construction fails and the diagnostic names DEVICE_CONFIG_DEVICE_PLUGIN_1 hakoniwa%2Csensor-instance and says to use the same library as plugin 0.
