# Corrections to the pinned ST SVD files (spec/svd-sources.yaml).
# The ST SVD is the canonical source of register definitions. Where it disagrees with the
# reference manual, the manual wins and the correction is recorded here, one entry per
# difference, with the manual page as evidence. Tools apply these patches on top of the
# SVD; nothing else may override the SVD.
#
# Entry: soc, peripheral (SVD name; applies to instances derived from it as well),
# register, and one of: reset / field {name, lsb, width} / add_field {name, lsb, width};
# evidence: manual, section, page; found: how and when it was found.
# Reference only (not a source): stm32-rs patched SVDs, https://github.com/stm32-rs/stm32-rs
patches:
  - soc: "st,stm32f7"
    peripheral: TIM1
    register: ARR
    reset: "0x0000FFFF"
    svd_has: "0x00000000"
    evidence: {manual: RM0410 Rev 5, section: "25.4.14 TIMx_ARR (x = 1, 8)", page: 935}
    found: "SVD vs hand-written map vs manual, 2026-11-07"
  - soc: "st,stm32h7"
    peripheral: TIM1
    register: ARR
    reset: "0x0000FFFF"
    svd_has: "0x00000000"
    evidence: {manual: RM0433 Rev 9, section: "38.4.14 TIMx_ARR (x = 1, 8)", page: 1609}
    found: "SVD vs hand-written map vs manual, 2026-11-07"
  - soc: "st,stm32f7"
    peripheral: TIM2
    register: ARR
    reset: "0xFFFFFFFF"
    svd_has: "0x00000000"
    evidence: {manual: RM0410 Rev 5, section: "26.4.14 TIMx_ARR (x = 2 to 5)", page: 1017}
    found: "manual check, 2026-11-07"
  - soc: "st,stm32h7"
    peripheral: TIM2
    register: ARR
    reset: "0xFFFFFFFF"
    svd_has: "0x00000000"
    evidence: {manual: RM0433 Rev 9, section: "39.4.14 TIMx_ARR (x = 2 to 5)", page: 1697}
    found: "manual check, 2026-11-07"
  - soc: "st,stm32f7"
    peripheral: SPI1
    register: I2SPR
    reset: "0x00000002"
    svd_has: "0x0000000A"
    evidence: {manual: RM0410 Rev 5, section: "35.9.9 SPIx_I2SPR", page: 1356}
    found: "SVD vs hand-written map vs manual, 2026-11-07"
  - soc: "st,stm32f7"
    peripheral: USART1
    register: ISR
    reset: "0x020000C0"
    svd_has: "0x000000C0"
    evidence: {manual: RM0410 Rev 5, section: "34.8.8 USART_ISR (TCBGT set at reset)"}
    found: "manual check, 2026-11-07 (SVD and hand-written map agreed and were both wrong)"
  - soc: "st,stm32h7"
    peripheral: SDMMC1
    register: RESPCMDR
    reset: "0x00000000"
    svd_has: "0xA3C5DD01"
    evidence: {manual: RM0433 Rev 9, section: "55.10.5 SDMMC_RESPCMDR"}
    found: "SVD vs hand-written map vs manual, 2026-11-07"
  - soc: "st,stm32h7"
    peripheral: SPI1
    register: IER
    field_access: {TXPIE: read-write, DPXPIE: read-write}
    svd_has: {TXPIE: read-only, DPXPIE: read-only}
    manual_access: "rs (set by software, cleared by hardware)"
    evidence: {manual: RM0433 Rev 9, section: "50.11.5 SPI_IER", page: 2223}
    found: "map_gen access check, 2026-11-07"
  - soc: "st,stm32h7"
    peripheral: SPI1
    register: CR1
    field_access: {CSTART: read-write}
    svd_has: {CSTART: read-only}
    manual_access: "rs (set by software to start, cleared by hardware at EOT)"
    evidence: {manual: RM0433 Rev 9, section: "50.11.1 SPI_CR1", page: 2216}
    found: "map_gen access check, 2026-11-07"
  - soc: "st,stm32f7"
    peripheral: TIM1
    register: CCMR1_Output
    add_fields: [{name: OC1M_3, lsb: 16, width: 1}, {name: OC2M_3, lsb: 24, width: 1}]
    svd_has: "fields absent"
    evidence: {manual: RM0410 Rev 5, section: "25.4.7 TIMx_CCMR1 (OC1M[3] bit 16, OC2M[3] bit 24)", page: 927}
    found: "map_gen binding check, 2026-11-07 (the H7 SVD has them)"
  - soc: "st,stm32f7"
    peripheral: TIM1
    register: CCMR2_Output
    add_fields: [{name: OC3M_3, lsb: 16, width: 1}, {name: OC4M_3, lsb: 24, width: 1}]
    svd_has: "fields absent"
    evidence: {manual: RM0410 Rev 5, section: "25.4.8 TIMx_CCMR2 (OC3M[3] bit 16, OC4M[3] bit 24)", page: 930}
    found: "map_gen binding check, 2026-11-07"
