ip: st-stm32-usart-v1
compatible:
- st,stm32-usart
- st,stm32-uart
manual: RM0410 Rev 5 section 34 (USART), STM32F76xxx/F77xxx
model: uart
model_version: 1.0.0
features:
- base
- dma
- inversion
svd:
  st,stm32f7: USART1
notes:
- note_selection: Zephyr uses the same compatible for F7 and H7 USARTs; the IP version is selected by the SoC compatible of
    the root node.
bindings:
  enable:
    reg: CR1
    field: UE
    access: rw
  tx_enable:
    reg: CR1
    field: TE
    access: rw
  rx_enable:
    reg: CR1
    field: RE
    access: rw
  word_length:
    reg: CR1
    field:
    - M1
    - M0
    access: rw
    note: M1:M0 = 00 8 bits, 01 9 bits, 10 7 bits (incl. parity)
  parity:
    reg: CR1
    field:
    - PCE
    - PS
    access: rw
  stop_bits:
    reg: CR2
    field: STOP
    access: rw
  baud_divider:
    reg: BRR
    field:
    - DIV_Fraction
    - DIV_Mantissa
    access: rw
    note: the SVD splits BRR into two fields; concatenated in bit order
  oversampling:
    reg: CR1
    field: OVER8
    access: rw
  tx_data:
    reg: TDR
    access: fifo
  rx_data:
    reg: RDR
    access: fifo
  tx_space:
    reg: ISR
    field: TXE
    access: ro
  tx_complete:
    reg: ISR
    field: TC
    access: ro
  rx_available:
    reg: ISR
    field: RXNE
    access: ro
  idle_line:
    reg: ISR
    field: IDLE
    access: ro
  overrun:
    reg: ISR
    field: ORE
    access: ro
  framing_error:
    reg: ISR
    field: FE
    access: ro
  parity_error:
    reg: ISR
    field: PE
    access: ro
  status_ack:
    reg: ICR
    field:
    - IDLECF
    - ORECF
    - FECF
    - PECF
    - TCCF
    access: w1c
  tx_irq_enable:
    reg: CR1
    field: TXEIE
    access: rw
  tc_irq_enable:
    reg: CR1
    field: TCIE
    access: rw
  rx_irq_enable:
    reg: CR1
    field: RXNEIE
    access: rw
  idle_irq_enable:
    reg: CR1
    field: IDLEIE
    access: rw
  irq:
    devicetree: interrupts
  tx_dma_enable:
    reg: CR3
    field: DMAT
    access: rw
  rx_dma_enable:
    reg: CR3
    field: DMAR
    access: rw
  tx_dma_request:
    devicetree: dmas, dma-names = tx
  rx_dma_request:
    devicetree: dmas, dma-names = rx
  rx_invert:
    reg: CR2
    field: RXINV
    access: rw
  tx_invert:
    reg: CR2
    field: TXINV
    access: rw
  swap_pins:
    reg: CR2
    field: SWAP
    access: rw
constants:
  fifo_depth: 1
unmodelled:
- reg:
  - CR2
  - CR3
  fields:
  - clock, LIN, smartcard, IrDA, RS-485, auto baud rate, flow control
  answer: stored and read back
- reg:
  - GTPR
  - RTOR
  - RQR
  answer: stored (RQR flush requests act on the FIFOs)
