        width: 1
      SWAP:
        lsb: 15
        width: 1
      RXINV:
        lsb: 16
        width: 1
      TXINV:
        lsb: 17
        width: 1
      DATAINV:
        lsb: 18
        width: 1
      MSBFIRST:
        lsb: 19
        width: 1
      ABREN:
        lsb: 20
        width: 1
      ABRMOD:
        lsb: 21
        width: 2
      RTOEN:
        lsb: 23
        width: 1
      ADD:
        lsb: 24
        width: 8
  CR3:
    offset: '0x08'
    reset: '0x00000000'
    fields:
      EIE:
        lsb: 0
        width: 1
      IREN:
        lsb: 1
        width: 1
      IRLP:
        lsb: 2
        width: 1
      HDSEL:
        lsb: 3
