        lsb: 0
        width: 1
      RE:
        lsb: 2
        width: 1
      TE:
        lsb: 3
        width: 1
      IDLEIE:
        lsb: 4
        width: 1
      PEIE:
        lsb: 8
        width: 1
      PS:
        lsb: 9
        width: 1
      PCE:
        lsb: 10
        width: 1
      WAKE:
        lsb: 11
        width: 1
      M0:
        lsb: 12
        width: 1
      MME:
        lsb: 13
        width: 1
      CMIE:
        lsb: 14
        width: 1
      OVER8:
        lsb: 15
        width: 1
      DEDT:
