      DXPIE:
        lsb: 2
        width: 1
      EOTIE:
        lsb: 3
        width: 1
      TXTFIE:
        lsb: 4
        width: 1
      UDRIE:
        lsb: 5
        width: 1
      OVRIE:
        lsb: 6
        width: 1
      CRCEIE:
        lsb: 7
        width: 1
      TIFREIE:
        lsb: 8
