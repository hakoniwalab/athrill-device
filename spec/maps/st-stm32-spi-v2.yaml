      LSBFRST:
        lsb: 23
        width: 1
      CPHA:
        lsb: 24
        width: 1
      CPOL:
        lsb: 25
        width: 1
      SSM:
        lsb: 26
        width: 1
      SSIOP:
        lsb: 28
        width: 1
      SSOE:
        lsb: 29
