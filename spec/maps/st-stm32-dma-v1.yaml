stream:
  stride: '0x18'
  base: '0x10'
  count: 8
  registers:
    CR:
      offset: '0x00'
      reset: '0x00000000'
      fields:
        EN:
          lsb: 0
          width: 1
        DMEIE:
          lsb: 1
          width: 1
        TEIE:
          lsb: 2
          width: 1
        HTIE:
          lsb: 3
          width: 1
        TCIE:
          lsb: 4
          width: 1
        PFCTRL:
          lsb: 5
          width: 1
        DIR:
          lsb: 6
          width: 2
        CIRC:
          lsb: 8
          width: 1
        PINC:
          lsb: 9
          width: 1
        MINC:
          lsb: 10
          width: 1
        PSIZE:
          lsb: 11
          width: 2
        MSIZE:
          lsb: 13
          width: 2
        PINCOS:
          lsb: 15
          width: 1
        PL:
          lsb: 16
          width: 2
        DBM:
          lsb: 18
          width: 1
        CT:
          lsb: 19
          width: 1
        PBURST:
          lsb: 21
          width: 2
        MBURST:
          lsb: 23
          width: 2
    NDTR:
      offset: '0x04'
      reset: '0x00000000'
      fields:
        NDT:
          lsb: 0
          width: 16
    PAR:
      offset: '0x08'
      reset: '0x00000000'
      fields:
        PA:
          lsb: 0
          width: 32
    M0AR:
      offset: '0x0C'
      reset: '0x00000000'
      fields:
        M0A:
          lsb: 0
          width: 32
    M1AR:
      offset: '0x10'
      reset: '0x00000000'
      fields:
        M1A:
          lsb: 0
          width: 32
    FCR:
      offset: '0x14'
      reset: '0x00000021'
      fields:
        FTH:
          lsb: 0
          width: 2
        DMDIS:
          lsb: 2
          width: 1
        FS:
          lsb: 3
          width: 3
        FEIE:
          lsb: 7
          width: 1
  note: 'F7: CR bits 25..27 CHSEL select the request channel. H7: CHSEL does not exist (request via DMAMUX), bits 20 TRBUFF.'
