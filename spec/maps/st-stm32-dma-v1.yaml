ip: st-stm32-dma-v1
compatible:
- st,stm32-dma-v1
- st,stm32-dma
soc: st,stm32f7 | st,stm32h7
manual: RM0410 Rev 5 section 8.5; RM0433 Rev 8 section 15.5 (DMA registers)
model: dma-controller
model_version: 1.0.0
features:
- base
- fifo
- double_buffer
features_h7_add:
- mux (via st-stm32-dmamux)
bindings:
  stream_enable:
    reg: SxCR
    field: EN
    access: rw
  direction:
    reg: SxCR
    field: DIR
    access: rw
  request_select:
    reg: SxCR
    field: CHSEL
    access: rw
    note: 'F7 only; H7: mux_request_id in DMAMUX'
  peripheral_address:
    reg: SxPAR
    field: PA
    access: rw
  memory_address:
    reg:
    - SxM0AR
    - SxM1AR
    access: rw
  item_count:
    reg: SxNDTR
    field: NDT
    access: rw
  peripheral_width:
    reg: SxCR
    field: PSIZE
    access: rw
  memory_width:
    reg: SxCR
    field: MSIZE
    access: rw
  peripheral_increment:
    reg: SxCR
    field: PINC
    access: rw
  memory_increment:
    reg: SxCR
    field: MINC
    access: rw
  circular:
    reg: SxCR
    field: CIRC
    access: rw
  half_transfer:
    reg: LISR/HISR
    field: HTIFn
    access: ro
  transfer_complete:
    reg: LISR/HISR
    field: TCIFn
    access: ro
  transfer_error:
    reg: LISR/HISR
    field: TEIFn
    access: ro
  flag_ack:
    reg: LIFCR/HIFCR
    field: C*IFn
    access: w1c
  ht_irq_enable:
    reg: SxCR
    field: HTIE
    access: rw
  tc_irq_enable:
    reg: SxCR
    field: TCIE
    access: rw
  te_irq_enable:
    reg: SxCR
    field: TEIE
    access: rw
  stream_irq:
    devicetree: interrupts (one per stream)
  fifo_mode:
    reg: SxFCR
    field:
    - DMDIS
    - FTH
    access: rw
  double_buffer:
    reg: SxCR
    field: DBM
    access: rw
  current_target:
    reg: SxCR
    field: CT
    access: rw
registers_source: RM0433 Rev 8 section 15.5 / RM0410 Rev 5 section 8.5, hand-written
