ip: st-stm32-exti-v2
compatible:
- st,stm32-exti
- st,stm32h7-exti
soc: st,stm32h7
manual: 'RM0433 Rev 8 section 20.6 (EXTI registers: configuration part and CPU part C1), 12.3 (SYSCFG EXTICR)'
model: gpio-exti
model_version: 1.0.0
features:
- exti
bindings:
  line_source:
    reg: SYSCFG.EXTICRx
    field: EXTIn
    access: rw
  rising_trigger:
    reg: RTSR1
    field: TRn
    access: rw
  falling_trigger:
    reg: FTSR1
    field: TRn
    access: rw
  line_irq_enable:
    reg: CPUIMR1
    field: MRn
    access: rw
  software_trigger:
    reg: SWIER1
    field: SWIERn
    access: w1s
  pending:
    reg: CPUPR1
    field: PRn
    access: ro
  pending_ack:
    reg: CPUPR1
    field: PRn
    access: w1c
  line_irq:
    devicetree: interrupts (EXTI0..4, EXTI9_5, EXTI15_10)
note: 'RM0433 names the CPU registers C1IMR1/C1EMR1/C1PR1 (CMSIS: EXTI_Core / EXTI_D1 *IMR1). Lines 0-15 are the GPIO lines.'
unmodelled:
- reg:
  - D3PMR1
  - D3PCR1L
  - D3PCR1H
  - RTSR2/3
  - FTSR2/3
  - SWIER2/3
  - CPUIMR2/3
  - CPUEMR1-3
  - CPUPR2/3
  answer: stored / reset value
registers_source: RM0433 Rev 8 sections 20.6 and 12.3, hand-written
