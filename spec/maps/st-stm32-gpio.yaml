ip: st-stm32-gpio
compatible:
- st,stm32-gpio
soc: st,stm32f7 | st,stm32h7
manual: RM0410 Rev 5 section 6.4; RM0433 Rev 8 section 11.4 (GPIO registers). Same layout on F7 and H7.
model: gpio-exti
model_version: 1.0.0
features:
- base
bindings:
  pin_mode:
    reg: MODER
    field: MODERn
    access: rw
    note: 00 input, 01 output, 10 alternate, 11 analog
  output_level:
    reg: ODR
    field: ODn
    access: rw
  set_reset:
    reg: BSRR
    field:
    - BSn
    - BRn
    access: wo
  input_level:
    reg: IDR
    field: IDn
    access: ro
  pin_config:
    reg:
    - OTYPER
    - OSPEEDR
    - PUPDR
    - AFR
    - LCKR
    access: rw
    note: stored only
note_reset: Reset values of MODER/OSPEEDR/PUPDR differ per port (A/B debug pins); the model uses the per-port values of the
  existing code until the SVD map (#31).
registers_source: RM0433 Rev 8 section 11.4 / RM0410 Rev 5 section 6.4, hand-written
