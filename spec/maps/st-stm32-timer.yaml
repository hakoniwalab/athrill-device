ip: st-stm32-timer
compatible:
- st,stm32-timers
- st,stm32-pwm
soc: st,stm32f7 | st,stm32h7
manual: RM0410 Rev 5 sections 23-24 (TIM1/8, TIM2-5); RM0433 Rev 8 sections 38-39 (TIM1/8, TIM2-5). Same base layout on F7
  and H7.
model: timer
model_version: 1.0.0
features:
- base
- pwm
- capture
- dma
bindings:
  counter_enable:
    reg: CR1
    field: CEN
    access: rw
  prescaler:
    reg: PSC
    field: PSC
    access: rw
  auto_reload:
    reg: ARR
    field: ARR
    access: rw
    note: 16 bits except TIM2/TIM5 (32)
  counter:
    reg: CNT
    field: CNT
    access: rw
  update_event:
    reg: SR
    field: UIF
    access: ro
  force_update:
    reg: EGR
    field: UG
    access: w1s
  preload:
    reg:
    - CR1
    - CCMR1
    - CCMR2
    field:
    - ARPE
    - OCxPE
    access: rw
  one_pulse:
    reg: CR1
    field: OPM
    access: rw
  flag_ack:
    reg: SR
    field: '*IF'
    access: w0c
    note: write 0 to clear
  update_irq_enable:
    reg: DIER
    field: UIE
    access: rw
  irq:
    devicetree: interrupts
  compare_value:
    reg: CCRx
    access: rw
  output_mode:
    reg:
    - CCMR1
    - CCMR2
    field:
    - OCxM
    - OCxM_3
    access: rw
  output_enable:
    reg:
    - CCER
    - BDTR
    field:
    - CCxE
    - MOE
    access: rw
    note: MOE on advanced timers (TIM1/8)
  output_polarity:
    reg: CCER
    field: CCxP
    access: rw
  compare_event:
    reg: SR
    field: CCxIF
    access: ro
  compare_irq_enable:
    reg: DIER
    field: CCxIE
    access: rw
  pulse_output:
    devicetree: athrill,pwm-actuator-map pwms
  capture_select:
    reg:
    - CCMR1
    - CCMR2
    field: CCxS
    access: rw
  capture_value:
    reg: CCRx
    access: ro
  capture_event:
    reg: SR
    field: CCxIF
    access: ro
  update_dma_enable:
    reg: DIER
    field: UDE
    access: rw
  update_dma_request:
    devicetree: dmas
constants:
  timer_clock: 'F7: APBx timer clock (x2 when APB prescaler != 1); H7: from RCC TIMPRE and D2PPREx; the existing models state
    the board values'
unmodelled:
- reg:
  - CR2
  - SMCR
  - RCR
  - BDTR
  - DCR
  - DMAR
  answer: stored (BDTR.MOE used)
- reg:
  - CCMR3
  - CCR5
  - CCR6
  - AF1
  - AF2
  - TISEL
  - OR
  answer: stored / reset value (offsets 0x50-0x68 differ F7/H7)
registers_source: RM0433 Rev 8 section 38.4 / RM0410 Rev 5 section 23.4, hand-written
