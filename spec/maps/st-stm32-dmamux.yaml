        offset: '0x00'
        reset: '0x00000000'
        fields:
          DMAREQ_ID:
            lsb: 0
            width: 7
          SOIE:
            lsb: 8
            width: 1
          EGE:
            lsb: 9
            width: 1
          SE:
            lsb: 16
            width: 1
          SPOL:
            lsb: 17
            width: 2
          NBREQ:
            lsb: 19
            width: 5
          SYNC_ID:
            lsb: 24
            width: 3
unmodelled:
- reg:
  - CSR
  - CFR
  - RGxCR
  - RGSR
  - RGCFR
  answer: reset value / stored
- reg: CxCR
  fields:
  - SOIE
  - EGE
  - SE
  - SPOL
  - NBREQ
  - SYNC_ID
