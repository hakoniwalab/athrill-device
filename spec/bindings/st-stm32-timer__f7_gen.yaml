- dma
notes:
- register_notes:
  - SMS is 4 bits split over [2:0] and [16]; OCxM is 4 bits split over [6:4]/[14:12] and [16]/[24] (OCxM_3); TS[4:3] at [21:20]
    exists on H7 only.
  - CCRx, ARR, CNT are 32 bits on TIM2/TIM5 and 16 bits on the other timers (CMSIS states 16).
  - RCR.REP is 8 bits on most timers, 16 on TIM1/TIM8 (H7 CMSIS states 8); DMAR access width 16 or 32.
  - RCR.REP is 8 bits on TIM1/TIM8 here (16 bits only on some advanced timers of other families).
- wide_instances:
    TIM2: CNT, ARR, CCR1-4 are 32 bits; ARR resets to 0xFFFFFFFF (RM0410 26.4.15, RM0433 39.4.15)
    TIM5: same as TIM2
constants:
  timer_clock: 'F7: APBx timer clock (x2 when APB prescaler != 1); H7: from RCC TIMPRE and D2PPREx; the existing models state
    the board values'
