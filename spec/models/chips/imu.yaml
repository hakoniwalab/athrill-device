model: imu
version: 1.0.0
summary: Accelerometer and gyroscope chips on SPI as used by PX4 and ArduPilot (ICM-20689, ICM-42688-P, IIM-42652, ICM-45686, and BMI055 accelerometer and gyroscope dies). Values come from the common sensor source (Hakoniwa sensor device or bench source).

terms:
  # base
  - {name: identity,         kind: status,  feature: base, meaning: "Chip ID register value from the datasheet (ADV-CHIP-*-001)."}
  - {name: reset,            kind: control, feature: base, meaning: "Soft reset: registers return to reset values."}
  - {name: power_mode,       kind: control, feature: base, meaning: "Sleep/normal per sensor; in sleep the data registers hold their last value."}
  - {name: accel_range,      kind: control, feature: accel, meaning: "Full scale of the accelerometer (e.g. ±2/4/8/16 g)."}
  - {name: gyro_range,       kind: control, feature: gyro,  meaning: "Full scale of the gyroscope (e.g. ±250..2000 dps)."}
  - {name: output_rate,      kind: control, feature: base, meaning: "Output data rate; samples are produced at this rate."}
  - {name: filter_config,    kind: control, feature: base, meaning: "Digital low-pass, anti-alias and bypass settings select the modeled in-chip filter response."}
  - {name: accel_sample,     kind: data,    feature: accel, meaning: "Three axes of acceleration as raw signed counts."}
  - {name: gyro_sample,      kind: data,    feature: gyro,  meaning: "Three axes of angular rate as raw signed counts."}
  - {name: temperature,      kind: data,    feature: base, meaning: "Die temperature as raw counts (datasheet formula)."}
  - {name: data_ready,       kind: status,  feature: base, meaning: "A new sample is in the data registers."}
  - {name: data_ready_line,  kind: event,   feature: base, meaning: "The chip's interrupt pin (Devicetree int-gpios)."}
  - {name: int_config,       kind: control, feature: base, meaning: "Which condition drives data_ready_line, level/pulse, polarity."}
  # fifo
  - {name: fifo_enable,      kind: control, feature: fifo, meaning: "Samples are pushed to the chip FIFO."}
  - {name: fifo_count,       kind: status,  feature: fifo, meaning: "Bytes (or samples) in the FIFO."}
  - {name: fifo_data,        kind: data,    feature: fifo, meaning: "FIFO read port in the datasheet's packet format."}
  - {name: fifo_overflow,    kind: status,  feature: fifo, meaning: "Samples were dropped because the FIFO was full."}
  - {name: fifo_reset,       kind: control, feature: fifo, meaning: "Empties the FIFO."}

features:
  base: Identity, reset, power, rate, temperature, data-ready.
  accel: Accelerometer.
  gyro: Gyroscope.
  fifo: Sample FIFO.

behaviour:
  - id: ADV-IMU-B001
    feature: base
    rule: identity reads the datasheet chip ID at any time after power-up and after reset.
  - id: ADV-IMU-B002
    feature: accel
    rule: An acceleration a (m/s², body FRD) from the sensor source first has the board's PX4 mount rotation (athrill,mount-rotation) undone as sensor = transpose(R) x body, then the driver's fixed chip-axis conversion is undone; the result reads as raw = round(sensor / g0 x counts_per_g(accel_range)) per axis, saturated to the signed register width, in the datasheet's byte order.
  - id: ADV-IMU-B003
    feature: gyro
    rule: An angular rate w (rad/s, body FRD) reads as raw = round(w x 180/pi x counts_per_dps(gyro_range)) per axis, saturated, with mount rotation, fixed chip axes, and byte order as for ADV-IMU-B002.
  - id: ADV-IMU-B004
    feature: base
    rule: A new sample is produced every 1 / output_rate of model time; data_ready turns on and data_ready_line follows int_config; reading the data (or the status, as the datasheet states) turns data_ready off.
  - id: ADV-IMU-B005
    feature: fifo
    rule: With fifo_enable, each sample is appended to the FIFO in the datasheet's packet format; fifo_count counts what is stored; reading fifo_data returns packets in order; when full, new samples are dropped and fifo_overflow turns on (or the oldest are overwritten, as the datasheet states).
  - id: ADV-IMU-B006
    feature: base
    rule: Multi-byte register reads auto-increment the register address as the datasheet states, so a burst returns all axes of one sample (no tearing between axes).
  - id: ADV-IMU-B007
    feature: base
    rule: The SPI read protocol (read bit, dummy bytes where the datasheet requires them, e.g. none on BMI055) follows the datasheet.
  - id: ADV-FIFO-001
    feature: fifo
    rule: A FIFO frame uses the value-source sample latched at or before that frame's sample time, derived from fifo_start and the configured sample period.
  - id: ADV-FIFO-002
    feature: fifo
    rule: After FIFO overflow, the readable frames are the newest capacity frames and each uses its own sample time.
  - id: ADV-FIFO-003
    feature: fifo
    rule: If the value source has no time-resolved operation or no retained sample for a frame time, that frame uses the latest sample.
  - id: ADV-FIFO-004
    feature: fifo
    rule: With a constant value source, FIFO frames and direct data-register reads are bit-identical to the pre-ABI-1.24 behaviour.
  - id: ADV-FIFO-005
    feature: fifo
    rule: Sample history costs one fixed-size copy per latch and O(1) lookup for periodic latches, and chips do no FIFO sample work until a frame is read.
  - id: ADV-FIFO-006
    feature: fifo
    rule: Repeating a run with the same latches, times and register accesses returns the same FIFO frames.
  - id: ADV-FIFO-007
    feature: fifo
    rule: ABI 1.24 sensor_sample_at returns the newest sample latched at or before the requested target-clock time, or -1 if none is retained.
  - id: ADV-FIFO-008
    feature: fifo
    rule: When output_rate or filter_config changes while the FIFO contains unread frames, those frames retain the values produced at their own sample times with the old sample period and filter settings, and later frames use the new configuration; an empty or disabled FIFO requires no materialization, and stream-mode overflow discards the oldest unread materialized frames before newer frames.
  - id: ADV-IMU-FILTER-001
    feature: base
    rule: With the boolean athrill,ideal-filters property on an IMU node, all modeled in-chip filters are bypassed and FIFO and direct data use the unfiltered time-resolved value-source sample; without it filters are enabled.
  - id: ADV-IMU-FILTER-002
    feature: base
    rule: Filter state advances only when FIFO or direct data is read, at the selected output data rate through value-source history; if the unread interval starts before retained history, state restarts at the oldest retained sample, so work is bounded by retained history.

timing: Samples are produced at output_rate in model time; the sensor source's sample at that time is used.
out_of_scope:
  - self-test, wake-on-motion, tap/step detection, offset registers other than as stored, I2C/I3C mode of these chips, noise and bias (Hakoniwa Drone's sensor models provide them in the source values)
