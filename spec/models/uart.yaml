model: uart
version: 1.0.0
summary: Asynchronous serial port (USART/UART) as used by PX4 and ArduPilot for console, GPS, telemetry and RC (8/9-bit, parity, stop bits, DMA).

terms:
  # base
  - {name: enable,           kind: control, feature: base, meaning: "The port is active; while off, nothing is sent or received."}
  - {name: tx_enable,        kind: control, feature: base, meaning: "The transmitter may send."}
  - {name: rx_enable,        kind: control, feature: base, meaning: "The receiver accepts characters from the line."}
  - {name: word_length,      kind: control, feature: base, meaning: "Data bits per character (7, 8 or 9, including the parity bit when enabled)."}
  - {name: parity,           kind: control, feature: base, meaning: "None, even or odd."}
  - {name: stop_bits,        kind: control, feature: base, meaning: "1 or 2 (0.5/1.5 stored only)."}
  - {name: baud_divider,     kind: control, feature: base, meaning: "With the kernel clock (and oversampling) it gives the bit time."}
  - {name: oversampling,     kind: control, feature: base, meaning: "16 or 8; enters the bit time."}
  - {name: tx_data,          kind: data,    feature: base, meaning: "Writing a character queues it for transmission."}
  - {name: rx_data,          kind: data,    feature: base, meaning: "Reading returns the oldest received character."}
  - {name: tx_space,         kind: status,  feature: base, meaning: "Another character can be queued."}
  - {name: tx_complete,      kind: status,  feature: base, meaning: "All queued characters have left the line."}
  - {name: rx_available,     kind: status,  feature: base, meaning: "At least one received character can be read."}
  - {name: idle_line,        kind: status,  feature: base, meaning: "The line has been idle for one character time after reception."}
  - {name: overrun,          kind: status,  feature: base, meaning: "A character arrived while the receive storage was full; it is lost."}
  - {name: framing_error,    kind: status,  feature: base, meaning: "Stored only; the model's line never produces framing errors."}
  - {name: parity_error,     kind: status,  feature: base, meaning: "Stored only; the model's line never produces parity errors."}
  - {name: status_ack,       kind: ack,     feature: base, meaning: "Driver action that clears idle_line, overrun, framing_error, parity_error, tx_complete."}
  - {name: tx_irq_enable,    kind: control, feature: base, meaning: "tx_space raises irq."}
  - {name: tc_irq_enable,    kind: control, feature: base, meaning: "tx_complete raises irq."}
  - {name: rx_irq_enable,    kind: control, feature: base, meaning: "rx_available or overrun raises irq."}
  - {name: idle_irq_enable,  kind: control, feature: base, meaning: "idle_line raises irq."}
  - {name: irq,              kind: event,   feature: base, meaning: "The port's interrupt line (Devicetree interrupts)."}
  # dma
  - {name: tx_dma_enable,    kind: control, feature: dma, meaning: "tx_space raises the transmit DMA request."}
  - {name: rx_dma_enable,    kind: control, feature: dma, meaning: "rx_available raises the receive DMA request."}
  - {name: tx_dma_request,   kind: event,   feature: dma, meaning: "Transmit DMA request (dmas entry tx)."}
  - {name: rx_dma_request,   kind: event,   feature: dma, meaning: "Receive DMA request (dmas entry rx)."}
  # fifo
  - {name: fifo_enable,      kind: control, feature: fifo, meaning: "Transmit and receive FIFOs are used."}
  - {name: rx_fifo_full,     kind: status,  feature: fifo, meaning: "The receive FIFO is full."}
  - {name: tx_fifo_empty,    kind: status,  feature: fifo, meaning: "The transmit FIFO is empty."}
  # inversion
  - {name: rx_invert,        kind: control, feature: inversion, meaning: "Received levels are inverted (SBUS)."}
  - {name: tx_invert,        kind: control, feature: inversion, meaning: "Transmitted levels are inverted."}
  - {name: swap_pins,        kind: control, feature: inversion, meaning: "TX and RX pins exchanged; stored, no effect in the model."}

features:
  base: Character transmit/receive with status, errors (stored) and interrupts.
  dma: DMA requests for transmit and receive.
  fifo: Transmit and receive FIFOs.
  inversion: Signal inversion and pin swap.

behaviour:
  - id: ADV-UART-B001
    feature: base
    rule: While enable or tx_enable is off, writing tx_data sends nothing; while enable or rx_enable is off, characters from the line are dropped without status.
  - id: ADV-UART-B002
    feature: base
    rule: A queued character occupies (1 start + word_length + stop_bits) bit times on the line; characters leave in the order written, each starting when the previous one ends (ADV-UART-003/004).
  - id: ADV-UART-B003
    feature: base
    rule: tx_space is on whenever another character can be queued; tx_complete turns on when the last queued character has left the line and stays on until status_ack or a new tx_data.
  - id: ADV-UART-B004
    feature: base
    rule: A received character becomes readable at rx_data at its completion clock and rx_available turns on; reading the last readable character turns rx_available off.
  - id: ADV-UART-B005
    feature: base
    rule: When a character completes while the receive storage is full, it is lost and overrun turns on until status_ack.
  - id: ADV-UART-B006
    feature: base
    rule: One character time after the last received character with no new character, idle_line turns on until status_ack; it does not turn on again before another character is received.
  - id: ADV-UART-B007
    feature: base
    rule: irq is raised while (tx_irq_enable and tx_space) or (tc_irq_enable and tx_complete) or (rx_irq_enable and (rx_available or overrun)) or (idle_irq_enable and idle_line).
  - id: ADV-UART-B008
    feature: dma
    rule: rx_dma_request is raised while rx_dma_enable and rx_available; tx_dma_request while tx_dma_enable and tx_space.
  - id: ADV-UART-B009
    feature: fifo
    rule: With fifo_enable, up to the IP's FIFO depth characters can be queued or held for reading; rx_fifo_full and tx_fifo_empty report the FIFO ends.
  - id: ADV-UART-B010
    feature: inversion
    rule: Inversion settings are stored and reported; the model line carries logical characters, so they do not change data.
  - id: ADV-UART-B011
    feature: base
    rule: Transmit and receive are independent (ADV-UART-005).

timing: Character completion clocks follow ADV-UART-003 and the timing rules of docs/device-tree-design.md.
out_of_scope:
  - synchronous mode, smartcard, IrDA, LIN, RS-485 driver enable, auto baud rate, wake-up from stop mode, hardware flow control (stored only)
